# Local PostgreSQL for development:  docker compose up -d db
# Credentials here are for local development only.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: threatintel
      POSTGRES_PASSWORD: threatintel
      POSTGRES_DB: threatintel
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threatintel"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
